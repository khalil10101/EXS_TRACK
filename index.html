<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Modules</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main id="modules" class="modules"></main>

  <script src="script.js"></script>
</body>
</html>
